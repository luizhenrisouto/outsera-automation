name: CI

# Roda a cada commit (push em qualquer branch), em pull requests para o main e sob demanda.
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      carga_completa:
        description: 'Rodar a carga completa (500 usuários por 5 minutos) em vez da versão curta'
        type: boolean
        default: false

# Um commit novo na mesma branch cancela a execução anterior, que ficou obsoleta.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  NODE_VERSION: 24

jobs:
  qualidade:
    name: Lint e typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run check

  api:
    name: Testes de API
    needs: qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Executar a suíte de API
        run: npm run test:api
      - name: Resumo da execução
        if: ${{ !cancelled() && hashFiles('reports/json/results.json') != '' }}
        run: |
          npm run resumo
          cat reports/resumo.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar relatórios
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-api
          path: reports/
          retention-days: 14

  e2e:
    name: Testes E2E (Cucumber)
    needs: qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Versão do Playwright (chave do cache do navegador)
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache do Chromium
        id: cache-browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Instalar o Chromium
        if: steps.cache-browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Instalar dependências do sistema do Chromium
        if: steps.cache-browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Executar a suíte E2E
        run: npm run test:e2e
      - name: Resumo da execução
        if: ${{ !cancelled() && hashFiles('reports/json/results.json') != '' }}
        run: |
          npm run resumo
          cat reports/resumo.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar relatórios, prints, vídeos e traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-e2e
          path: reports/
          retention-days: 14

  carga:
    name: Teste de carga (k6)
    needs: qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # A cada commit roda uma versão curta, que valida o script e os critérios de aceite.
      # A carga completa (500 usuários por 5 minutos) roda sob demanda, pelo workflow_dispatch.
      VUS: ${{ inputs.carga_completa && '500' || '50' }}
      DURACAO: ${{ inputs.carga_completa && '5m' || '30s' }}
      RAMPA: ${{ inputs.carga_completa && '30s' || '10s' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: grafana/setup-k6-action@v1
      - name: Executar o teste de carga contra a API mock
        run: node scripts/rodar-carga.mjs
      - name: Resumo da execução
        if: ${{ !cancelled() && hashFiles('reports/load/resumo.md') != '' }}
        run: cat reports/load/resumo.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar relatórios
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-carga
          path: |
            reports/load/relatorio.html
            reports/load/resumo.md
            reports/load/summary.json
            reports/load/janelas.md
          retention-days: 14
